                <div className="space-y-2 mb-6 text-sm">
                  <div className="flex"><span className="w-20 font-bold">To:</span> <span className="border px-2 w-full bg-gray-50">nguyenbooklover@dmail.com</span></div>
                  <div className="flex"><span className="w-20 font-bold">From:</span> <span className="border px-2 w-full bg-gray-50">part.gymworkers@dmail.com</span></div>
                  <div className="flex"><span className="w-20 font-bold">Subject:</span> <span className="border px-2 w-full bg-gray-50">You're Invited - Bring Friends & Family to Our Grand Opening!</span></div>
                </div>
                <div className="border border-gray-300 p-4 h-72 overflow-y-auto text-gray-800 text-sm">
                  <p className="mb-4">Dear Ms. Nguyen,</p>
                  <p className="mb-4">We're excited to invite you—and your friends and family—to the grand opening of our new branch at 25 Orchid Street, happening next Monday. This event is a great opportunity to explore our state-of-the-art facility, featuring top-tier equipment, energizing group classes, and expert personal training.</p>
                  <p className="mb-4">This celebration, exclusively for our valued members and their guests, will include guided tours, live fitness demonstrations, and complimentary refreshments. It's the perfect chance to experience our community-focused approach to wellness and introduce others to a space designed for all fitness levels.</p>
                  <p className="mb-4">Bring your friends and family! We're offering a special one-day-only discount on memberships for all attendees.</p>
                  <p className="mb-4">For questions or to RSVP, contact our customer service team at 555-1234.</p>
                  <p>Warm regards,<br/>John Parker</p>
                </div>
              </div>
            </div>
          );
        }
        if (currentQ.group === 'academic') {
          return (
            <div className="p-8 font-serif bg-white h-full">
              <h2 className="text-2xl font-bold mb-6 text-center">The Paradox of Choice</h2>
              <p className="leading-loose text-[16px] text-gray-800 mb-4 indent-8">
                The paradox of choice, a concept popularized by psychologist Barry Schwartz, suggests that more options can lead to less satisfaction. While the freedom to choose is fundamental to consumer culture, an overabundance of choices—from groceries to electronics—can overwhelm individuals, causing anxiety and decision fatigue. This paradox implies that the vast array of possibilities available today might actually diminish consumer contentment, as the fear of making the wrong choice looms large.
              </p>
              <p className="leading-loose text-[16px] text-gray-800 mb-4 indent-8">
                Research supports this notion. In an experiment, psychologist Sheena Iyengar found that shoppers were more likely to purchase jam when offered 6 varieties instead of 24. The limited selection eased the decision process, reducing the pressure to find the 'perfect' option and making the experience more enjoyable. This phenomenon reveals that fewer choices can sometimes make consumers happier, which is a valuable insight for marketers and retailers aiming to boost satisfaction by curating their offerings.
              </p>
              <p className="leading-loose text-[16px] text-gray-800 mb-4 indent-8">
                The paradox also has broader implications. In individualistic cultures, where personal choice is highly valued, the burden of decision-making can be significant. Conversely, collectivist cultures, which often provide fewer choices, report higher levels of contentment. This dynamic suggests that understanding cultural differences in consumer psychology can help businesses optimize their product strategies and enhance overall well-being.
              </p>
            </div>
          );
        }
      };

      if (screen === 'intro') {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4 font-sans text-gray-800">
            <div className="bg-white max-w-2xl w-full rounded-xl shadow-xl overflow-hidden border border-gray-200">
              <div className="bg-[#007b85] text-white p-6 text-center shadow-inner">
                <h1 className="text-3xl font-bold tracking-wide">TOEFL iBT Practice Test 1</h1>
                <p className="mt-2 text-[#b0e8ec] font-medium">Reading Section</p>
              </div>
              <div className="p-8">
                <p className="mb-6 text-gray-700 leading-relaxed font-medium">
                  In an actual test, you will answer up to 50 questions to demonstrate how well you understand academic and non-academic texts in English. There are three types of tasks.
                </p>
                <table className="w-full border-collapse mb-8">
                  <thead>
                    <tr className="bg-gray-100">
                      <th className="border p-3 text-left">Type of Task</th>
                      <th className="border p-3 text-left">Description</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td className="border p-3 font-bold text-[#007b85]">Complete the Words</td>
                      <td className="border p-3">Fill in the missing letters in a paragraph.</td>
                    </tr>
                    <tr>
                      <td className="border p-3 font-bold text-[#007b85]">Read in Daily Life</td>
                      <td className="border p-3">Answer questions about everyday reading material.</td>
                    </tr>
                    <tr>
                      <td className="border p-3 font-bold text-[#007b85]">Read an Academic Passage</td>
                      <td className="border p-3">Answer questions about academic passages.</td>
                    </tr>
                  </tbody>
                </table>
                <div className="flex justify-center mt-8">
                  <button onClick={() => setScreen('m1_intro')} className="bg-[#007b85] hover:bg-[#005f66] text-white font-bold py-3 px-12 rounded shadow-md transition-colors">
                    NEXT
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (screen === 'm1_intro' || screen === 'm2_intro') {
        const isM1 = screen === 'm1_intro';
        return (
          <div className="min-h-screen bg-[#007b85] flex flex-col items-center justify-center p-4 font-sans text-white">
            <h1 className="text-4xl font-bold mb-8">Reading Section, Module {isM1 ? '1' : '2'}</h1>
            <div className="bg-white text-gray-800 max-w-xl p-8 rounded shadow-lg text-center">
              <p className="mb-4 font-medium">In an actual test, the clock will show you how much time you have to complete Module {isM1 ? '1' : '2'}.</p>
              <p className="mb-4 font-medium">You can use Next and Back to move to the next question or return to previous questions within the same module.</p>
              {isM1 && <p className="mb-6 text-red-600 font-bold">In an actual test, you WILL NOT be able to return to Module 1 once you have begun Module 2.</p>}
              <button onClick={isM1 ? startModule1 : startModule2} className="bg-[#007b85] hover:bg-[#005f66] text-white font-bold py-3 px-12 rounded shadow-md transition-colors">
                BEGIN MODULE {isM1 ? '1' : '2'}
              </button>
            </div>
          </div>
        );
      }

      if (screen === 'm1_review' || screen === 'm2_review') {
        const isM1 = screen === 'm1_review';
        const activeQ = isM1 ? module1Data.questions : module2Data.questions;
        return (
          <div className="min-h-screen flex flex-col bg-gray-50 font-sans">
            <div className="bg-[#007b85] text-white flex justify-between items-center px-6 py-4 shadow-md">
              <div className="text-lg font-bold tracking-wide">TOEFL iBT - Module {isM1 ? '1' : '2'} Review</div>
              <div className="flex items-center space-x-4">
                <div className="flex items-center font-mono font-bold bg-white text-black px-3 py-1 rounded">
                  <Clock size={16} className="mr-2" /> {formatTime(timeLeft)}
                </div>
                <button onClick={() => isM1 ? transitionToModule2() : endTest()} className="bg-white text-[#007b85] hover:bg-gray-100 px-4 py-1 text-sm font-bold rounded transition-colors">
                  {isM1 ? 'CONTINUE TO MODULE 2' : 'FINISH TEST'}
                </button>
              </div>
            </div>
            <div className="flex-1 max-w-4xl mx-auto w-full p-8">
              <h2 className="text-2xl font-bold mb-6 text-[#007b85]">Review Questions</h2>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {activeQ.map((q, idx) => {
                  let isAnswered = false;
                  let label = "";
                  if (q.type === 'cloze') {
                    isAnswered = q.qNums.every(n => (answers[`m${isM1 ? 1 : 2}_${n}`] || '').trim() !== '');
                    label = "Questions 1-10 (Cloze)";
                  } else {
                    isAnswered = !!answers[q.id];
                    label = `Question ${q.qNum}`;
                  }
                  return (
                    <button
                      key={idx}
                      onClick={() => jumpToQuestion(idx)}
                      className={`p-4 rounded border-2 text-left transition-colors ${isAnswered ? 'bg-white border-green-500' : 'bg-red-50 border-red-400'}`}
                    >
                      <div className="font-bold text-gray-800">{label}</div>
                      <div className={`text-sm mt-1 ${isAnswered ? 'text-green-600' : 'text-red-500 font-bold'}`}>
                        {isAnswered ? 'Answered' : 'Incomplete'}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        );
      }

      if (screen === 'results') {
        const { correctCount, totalQuestions, score } = calculateScore();
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4 font-sans">
            <div className="bg-white max-w-2xl w-full rounded-xl shadow-xl overflow-hidden p-8 text-center border border-gray-200">
              <h1 className="text-3xl font-bold text-[#007b85] mb-2">Test Complete</h1>
              <p className="text-gray-600 mb-8 font-medium">Unofficial ETS Reading Score Report</p>
              <div className="bg-gray-50 border border-gray-200 rounded-lg p-8 mb-8 shadow-inner">
                <div className="text-7xl font-bold text-[#007b85] mb-2">{score} <span className="text-4xl text-gray-400">/ 30</span></div>
                <p className="text-sm font-bold text-gray-500 uppercase tracking-widest mt-4">Estimated Scaled Score</p>
                <div className="mt-3 text-gray-700 font-mono font-medium">Raw Points: {correctCount} / {totalQuestions}</div>
              </div>
              <button onClick={restartTest} className="text-[#007b85] font-bold hover:underline">
                Restart Simulation
              </button>
            </div>
          </div>
        );
      }

      const mcQuestion = currentQ.type === 'mc' ? activeData.mcData[currentQ.id] : null;

      return (
        <div className="min-h-screen flex flex-col bg-white overflow-hidden font-sans" style={{ height: '100vh' }}>
          {/* Top Bar */}
          <div className="bg-[#007b85] text-white flex justify-between items-center px-4 py-2 shrink-0 shadow-md z-10">
            <div className="flex items-center space-x-6">
              <div className="text-sm font-bold uppercase tracking-wide">TOEFL iBT</div>
              <div className="text-sm font-bold">Reading - Module {currentModule}</div>
            </div>
            
            <div className="flex items-center space-x-3">
              {/* Controles do Relógio (Professor) */}
              <div className="flex items-center bg-white rounded shadow-sm px-2 py-1">
                <button 
                  onClick={() => setTimerActive(!timerActive)} 
                  className={`p-1 rounded flex items-center justify-center transition-colors ${timerActive ? 'text-red-600 hover:bg-red-50' : 'text-green-600 hover:bg-green-50'}`} 
                  title={timerActive ? "Pause Clock" : "Start Clock"}
                >
                  {timerActive ? <Pause size={18} /> : <Play size={18} />}
                </button>
                <div className="flex items-center font-mono font-bold text-black ml-2 pr-1">
                  <Clock size={16} className="mr-1 text-gray-500" /> {formatTime(timeLeft)}
                </div>
              </div>

              <button onClick={() => setScreen(`m${currentModule}_review`)} className="bg-white text-[#007b85] hover:bg-teal-50 px-3 py-1 text-sm font-bold rounded transition-colors flex items-center shadow-sm">
                <List size={16} className="mr-1" /> Review
              </button>

              {/* Controles Exclusivos de Navegação do Professor */}
              <div className="flex items-center bg-yellow-300 p-1 rounded shadow-sm border border-yellow-500 ml-4">
                <button onClick={goBack} disabled={currentIndex === 0} className={`bg-white text-gray-800 px-3 py-1 text-sm font-bold rounded-l flex items-center border-r border-gray-300 transition-colors ${currentIndex === 0 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100'}`}>
                  <ChevronLeft size={16} className="mr-1" /> Back
                </button>
                <button onClick={goNext} className="bg-white text-gray-800 hover:bg-gray-100 px-3 py-1 text-sm font-bold rounded-r flex items-center transition-colors">
                  Next <ChevronRight size={16} className="ml-1" />
                </button>
              </div>
            </div>
          </div>

          {/* Split Content */}
          <div className="flex flex-1 overflow-hidden">
            {/* Left Side */}
            <div className="w-1/2 border-r-4 border-gray-200 overflow-y-auto bg-white">
              {currentModule === 1 ? renderModule1LeftPanel() : renderModule2LeftPanel()}
            </div>

            {/* Right Side */}
            <div className="w-1/2 bg-[#f4f6f8] p-8 overflow-y-auto flex flex-col relative">
              {currentQ.type === 'cloze' ? (
                <div className="flex flex-col items-center justify-center h-full text-center">
                  <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-200 max-w-sm">
                    <CheckCircle size={48} className="mx-auto text-[#007b85] mb-4" />
                    <h3 className="text-xl font-bold mb-2">Complete the Words</h3>
                    <p className="text-gray-600 mb-6">Read the text on the left and fill in the missing letters in the blank spaces directly within the paragraph.</p>
                    <p className="text-sm font-bold text-yellow-600">Please wait for the teacher to continue.</p>
                  </div>
                </div>
              ) : (
                <div className="max-w-xl">
                  <div className="font-bold text-sm text-gray-500 uppercase tracking-widest mb-2">Question {currentQ.qNum}</div>
                  <div className="font-bold text-[18px] text-gray-900 mb-6 leading-relaxed">
                    {mcQuestion.text}
                  </div>
                  <div className="space-y-3">
                    {mcQuestion.options.map((option, idx) => {
                      const isSelected = answers[currentQ.id] === idx;
                      const isCorrect = idx === mcQuestion.correct;
                      
                      // Lógica do feedback visual (Verde/Vermelho)
                      const showGreen = isSelected && isCorrect;
                      const showRed = isSelected && !isCorrect;
                      const isAnswered = answers[currentQ.id] !== undefined;
                      const highlightCorrect = isAnswered && !isSelected && isCorrect; // Destaca sutilmente a certa se errar

                      let containerClass = "bg-white border-gray-300 hover:border-teal-400";
                      let textClass = "text-gray-800 font-medium";

                      if (showGreen) {
                        containerClass = "bg-green-100 border-green-500 shadow-sm";
                        textClass = "text-green-800 font-bold";
                      } else if (showRed) {
                        containerClass = "bg-red-100 border-red-500 shadow-sm";
                        textClass = "text-red-800 font-bold";
                      } else if (highlightCorrect) {
                        containerClass = "bg-green-50 border-green-400 border-dashed";
                        textClass = "text-green-700 font-bold";
                      }

                      return (
                        <label key={idx} className={`flex items-start p-4 border-2 rounded-lg cursor-pointer transition-all ${containerClass}`}>
                          <input 
                            type="radio" 
                            name={currentQ.id}
                            checked={isSelected}
                            onChange={() => handleSetAnswer(currentQ.id, idx)}
                            className="mt-1 w-4 h-4 text-[#007b85] border-gray-300 focus:ring-[#007b85]"
                          />
                          <span className={`ml-3 text-[15px] leading-snug ${textClass}`}>
                            {option}
                          </span>
                        </label>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
